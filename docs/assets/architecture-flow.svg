<svg width="1600" height="650" viewBox="0 0 1600 650" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="650" fill="#070A0F"/>
  <text x="70" y="78" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="38" font-weight="850">Arquitetura do pipeline.</text>
  <text x="70" y="116" fill="#94A3B8" font-family="Segoe UI, Arial" font-size="19">Captura, inferência e transmissão trabalham de forma independente para manter o painel fluido.</text>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L12 7L2 12V2Z" fill="#45C7FF"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Arial">
    <rect x="70" y="212" width="275" height="150" rx="12" fill="#101827" stroke="#253044"/>
    <text x="106" y="265" fill="#45C7FF" font-size="18" font-weight="850">01</text>
    <text x="106" y="305" fill="#F8FAFC" font-size="25" font-weight="850">Câmera ou vídeo.</text>
    <text x="106" y="336" fill="#94A3B8" font-size="16">Fonte de entrada.</text>

    <line x1="345" y1="287" x2="430" y2="287" stroke="#45C7FF" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="450" y="212" width="275" height="150" rx="12" fill="#101827" stroke="#253044"/>
    <text x="486" y="265" fill="#45C7FF" font-size="18" font-weight="850">02</text>
    <text x="486" y="305" fill="#F8FAFC" font-size="26" font-weight="850">Captura.</text>
    <text x="486" y="336" fill="#94A3B8" font-size="16">Frame mais recente.</text>

    <line x1="725" y1="287" x2="810" y2="287" stroke="#45C7FF" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="830" y="212" width="275" height="150" rx="12" fill="#101827" stroke="#253044"/>
    <text x="866" y="265" fill="#45C7FF" font-size="18" font-weight="850">03</text>
    <text x="866" y="305" fill="#F8FAFC" font-size="26" font-weight="850">YOLO + HSV.</text>
    <text x="866" y="336" fill="#94A3B8" font-size="16">Pessoa e colete.</text>

    <line x1="1105" y1="287" x2="1190" y2="287" stroke="#45C7FF" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1210" y="212" width="320" height="150" rx="12" fill="#101827" stroke="#253044"/>
    <text x="1246" y="265" fill="#45C7FF" font-size="18" font-weight="850">04</text>
    <text x="1246" y="305" fill="#F8FAFC" font-size="26" font-weight="850">Dashboard web.</text>
    <text x="1246" y="336" fill="#94A3B8" font-size="16">MJPEG, métricas e alertas.</text>

    <line x1="588" y1="362" x2="588" y2="422" stroke="#2DD47F" stroke-width="3"/>
    <line x1="968" y1="362" x2="968" y2="422" stroke="#2DD47F" stroke-width="3"/>

    <rect x="420" y="422" width="760" height="112" rx="12" fill="#0D121A" stroke="#253044"/>
    <text x="800" y="468" text-anchor="middle" fill="#CBD5E1" font-size="18" font-weight="700">Estado compartilhado: detecções, FPS e alertas.</text>
    <text x="800" y="500" text-anchor="middle" fill="#CBD5E1" font-size="18" font-weight="700">Status da câmera e do modelo em tempo real.</text>
