    <rect x="54" y="155" width="360" height="250" rx="12" fill="#101827" stroke="#253044"/>
    <rect x="84" y="190" width="62" height="62" rx="10" fill="#102B20"/>
    <text x="102" y="228" fill="#2DD47F" font-size="18" font-weight="900">OK</text>
    <text x="84" y="292" fill="#F8FAFC" font-size="25" font-weight="850">Com EPI.</text>
    <text x="84" y="324" fill="#94A3B8" font-size="15">Pessoa em conformidade com o uso do colete.</text>
    <text x="84" y="366" fill="#2DD47F" font-size="46" font-weight="900">Seguro.</text>
