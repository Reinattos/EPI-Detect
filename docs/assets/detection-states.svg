    <text x="490" y="292" fill="#F8FAFC" font-size="25" font-weight="850">Sem EPI.</text>
    <text x="490" y="324" fill="#94A3B8" font-size="15">Pessoa detectada sem o colete de segurança.</text>
    <text x="490" y="366" fill="#FF5D64" font-size="46" font-weight="900">Atenção.</text>
    <rect x="866" y="155" width="360" height="250" rx="12" fill="#101827" stroke="#253044"/>
    <rect x="896" y="190" width="62" height="62" rx="10" fill="#10283A"/>
    <text x="918" y="231" fill="#45C7FF" font-size="24" font-weight="900">%</text>
    <text x="896" y="292" fill="#F8FAFC" font-size="25" font-weight="850">Conformidade.</text>
    <text x="896" y="324" fill="#94A3B8" font-size="15">Percentual de pessoas usando EPI corretamente.</text>
    <rect x="896" y="354" width="260" height="12" rx="6" fill="#263246"/>
